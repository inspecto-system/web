openapi: 3.1.0
info:
  title: Inspecto — common components
  version: 0.4.0
  description: |
    Shared schemas, parameters, responses and security schemes referenced by every
    Inspecto service contract (core, media, report, ml). This document has no paths.
  license:
    name: Proprietary (coursework project)
    identifier: LicenseRef-Inspecto
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User access token (RS256, 15 minutes, audience `inspecto-api`) issued by core-service.
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service token (client credentials, audience `inspecto-internal`) issued by core-service. Accepted only on `/internal/**`.

  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page number.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Correlation identifier; generated by the server when absent and echoed in every response.
      schema:
        type: string
        maxLength: 64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated key; a repeated request with the same key returns the original result.
      schema:
        type: string
        minLength: 8
        maxLength: 64
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Preferred locale for dictionary names.
      schema:
        $ref: '#/components/schemas/Locale'

  headers:
    RequestId:
      description: Correlation identifier of the request.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer

  schemas:
    Uuid:
      type: string
      format: uuid
      examples: ['01932f6e-7c1a-7d4e-9b2a-3f1e5c8d9a10']
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 timestamp in UTC.
      examples: ['2026-11-04T16:02:00Z']
    Version:
      type: integer
      format: int64
      minimum: 0
      description: Optimistic locking version. Send the last known value with PATCH; a mismatch returns `409 VERSION_CONFLICT`.
    Locale:
      type: string
      enum: [ru, en]
      default: ru
    LocalizedText:
      type: object
      description: Translations keyed by locale (ADR-019).
      required: [ru]
      properties:
        ru:
          type: string
        en:
          type: string
      additionalProperties: false

    PageMeta:
      type: object
      required: [page, size, total]
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0

    Role:
      type: string
      enum: [ADMIN, INSPECTOR, CLIENT]
    PropertyType:
      type: string
      enum: [APARTMENT, HOUSE, COMMERCIAL, OTHER]
    RoomType:
      type: string
      enum: [LIVING, KITCHEN, BATHROOM, TOILET, HALLWAY, BALCONY, OTHER]
    ElementGroup:
      type: string
      enum: [WALLS, CEILING, FLOOR, WINDOWS, DOORS, PLUMBING, ELECTRICAL, OTHER]
    Severity:
      type: string
      description: COSMETIC — косметический, MINOR — незначительный, MAJOR — значительный, CRITICAL — критический (ADR-017).
      enum: [COSMETIC, MINOR, MAJOR, CRITICAL]
    InspectionStatus:
      type: string
      enum: [DRAFT, IN_PROGRESS, COMPLETED]
    ChecklistResult:
      type: string
      enum: [NOT_CHECKED, OK, DEFECT, NOT_APPLICABLE]
    ObservationStatus:
      type: string
      description: RESOLVED is set only by explicit user confirmation (ADR-004).
      enum: [OPEN, RESOLVED]
    DefectStatus:
      type: string
      description: Status of the latest observation.
      enum: [OPEN, RESOLVED]
    ComparisonState:
      type: string
      enum: [NEW, RESOLVED, REMAINING, NOT_CHECKED]
    ReportStatus:
      type: string
      enum: [QUEUED, RUNNING, DONE, FAILED]
    PhotoVariant:
      type: string
      enum: [original, preview, thumb]
      default: preview

    ErrorCode:
      type: string
      description: Machine-readable error code; clients map it to localized messages.
      enum:
        - VALIDATION_ERROR
        - UNSUPPORTED_MEDIA_TYPE
        - IMAGE_TOO_LARGE
        - IMAGE_DIMENSIONS_TOO_LARGE
        - PHOTO_LIMIT_EXCEEDED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - INVALID_CREDENTIALS
        - FORBIDDEN
        - NOT_FOUND
        - VERSION_CONFLICT
        - EMAIL_TAKEN
        - CATEGORY_CODE_TAKEN
        - RESOURCE_IN_USE
        - ALREADY_OBSERVED
        - INVALID_STATE_TRANSITION
        - REPORT_NOT_READY
        - ACCOUNT_LOCKED
        - RATE_LIMITED
        - DEPENDENCY_UNAVAILABLE
        - INTERNAL_ERROR
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          examples: [address]
        code:
          type: string
          description: Constraint that failed (NOT_BLANK, TOO_LONG, OUT_OF_RANGE, INVALID_FORMAT, …).
          examples: [NOT_BLANK]
    Problem:
      type: object
      description: RFC 9457 problem details (`application/problem+json`).
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri
          examples: ['https://inspecto.dev/problems/validation-error']
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

  responses:
    BadRequest:
      description: Validation failed (`VALIDATION_ERROR`) or the request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, invalid or expired token (`UNAUTHENTICATED`, `TOKEN_EXPIRED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The role does not allow the operation (`FORBIDDEN`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or belongs to another user (`NOT_FOUND`, ADR-009).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Version or state conflict (`VERSION_CONFLICT`, `INVALID_STATE_TRANSITION`, `EMAIL_TAKEN`, `CATEGORY_CODE_TAKEN`, `RESOURCE_IN_USE`, `ALREADY_OBSERVED`, `REPORT_NOT_READY`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded (`RATE_LIMITED`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: A dependency is unavailable (`DEPENDENCY_UNAVAILABLE`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected error (`INTERNAL_ERROR`); details are logged under `requestId`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
